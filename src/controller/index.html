<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1014">
  <title>VJ Remote</title>
  <style>
    /* Made for a dark room and a thumb: big targets, high contrast, one accent. */
    :root {
      --bg: #0d1014; --panel: #161b22; --line: #2a323d; --fg: #e8ecf1; --muted: #8b97a5;
      --accent: #ff5a36; --ok: #3ddc97;
      --gap: 12px;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      -webkit-tap-highlight-color: transparent;
    }
    main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

    header { display: flex; align-items: center; justify-content: space-between; gap: var(--gap); }
    h1 { font-size: 20px; margin: 0; letter-spacing: 0.02em; }
    .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
    .dot.on { background: var(--ok); }
    .dot.warn { background: var(--accent); }

    h2 { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
    section { min-width: 0; }
    .row { display: grid; gap: var(--gap); grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .row.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    button {
      font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      min-height: 64px; padding: 10px 14px; cursor: pointer; touch-action: manipulation;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      transition: transform 80ms ease, background 120ms ease, border-color 120ms ease;
    }
    button:active, button.sent { transform: scale(0.97); background: #1f2630; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button[disabled] { opacity: 0.4; cursor: default; }
    button small { color: var(--muted); font-size: 12px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    button.primary { grid-column: 1 / -1; min-height: 96px; font-size: 24px; font-weight: 600; background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary small { color: rgba(255,255,255,0.75); }
    button.primary:active, button.primary.sent { background: #e84a28; }
    button.toggle.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    button.toggle.active small::after { content: " · on"; color: var(--accent); }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips button { min-height: 44px; padding: 6px 14px; border-radius: 999px; font-size: 14px; flex-direction: row; }
    [hidden] { display: none !important; }
    .chips button.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }
    .chips button.current { background: var(--fg); color: var(--bg); border-color: var(--fg); }

    .players { display: flex; flex-direction: column; gap: 8px; }
    .player { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; min-width: 0; }
    .player b { font-weight: 600; }
    .player .file { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
    .empty { color: var(--muted); font-size: 14px; }

    /* One block per connected client, below the shared "All players" controls. */
    .client { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }
    .client h2 { margin: 0; color: var(--fg); font-size: 14px; }
    .client .file { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
    .client button { background: var(--bg); min-height: 52px; }
    .client .chips button.current { background: var(--fg); }
    #clients { display: flex; flex-direction: column; gap: 20px; }
    /* Players start folded (only the name and what it plays); tap the name to open one. */
    .client h2 { display: flex; align-items: center; justify-content: space-between; gap: var(--gap); cursor: pointer; user-select: none; -webkit-user-select: none; }
    .client h2::after { content: "▾"; color: var(--muted); font-size: 16px; transition: transform 0.15s; }
    .client h2:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
    .client.collapsed h2::after { transform: rotate(-90deg); }
    .client.collapsed > :not(h2):not(.file) { display: none; }
    #timing-box { margin-top: 0; }
    #timing-box .trow { display: flex; align-items: center; justify-content: space-between; gap: var(--gap); }
    #timing-box .trow span { font-size: 15px; }
    #timing-box .range { display: flex; align-items: center; gap: 8px; color: var(--muted); }
    #timing-box input { width: 72px; min-height: 44px; font: inherit; font-size: 16px; text-align: center; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>VJ Remote</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="status">connecting…</span></div>
  </header>

  <section>
    <h2>All players</h2>
  </section>

  <section>
    <h2>Media</h2>
    <div class="row">
      <button class="primary" data-key="arrowright" disabled>Next media <small>→ another file in this playlist</small></button>
    </div>
  </section>

  <section>
    <h2>Playlist</h2>
    <div class="row">
      <button data-key="x" disabled>◀ Previous <small>X</small></button>
      <button data-key="n" disabled>Next ▶ <small>N</small></button>
    </div>
    <div class="row" style="margin-top: var(--gap)">
      <button class="toggle" id="t-shuffle" data-key="r" disabled>Shuffle all <small>R · random files from every playlist</small></button>
    </div>
    <div class="chips" id="chips" style="margin-top: var(--gap)"></div>
    <h2 id="scenes-h" style="margin-top: var(--gap)" hidden>Scenes <small>random effects off · tap again to leave</small></h2>
    <div class="chips" id="scenes" hidden></div>
    <div class="row" style="margin-top: var(--gap)">
      <button id="spread" disabled>Spread playlists <small>player 1 → playlist 1, player 2 → playlist 2 …</small></button>
      <button id="spread-random" disabled>Random spread <small>a different playlist for every player</small></button>
    </div>
  </section>

  <section>
    <h2>Output</h2>
    <div class="row three">
      <button class="toggle" id="t-blackout" data-key="a" disabled>Blackout <small>A</small></button>
      <button class="toggle" id="t-mask" data-key="m" disabled>Circle <small>M</small></button>
      <button class="toggle" id="t-syphon" data-key="y" disabled>Syphon <small>Y</small></button>
      <button class="toggle" id="t-words" data-key="k" disabled>Keywords <small>K</small></button>
      <button class="toggle" id="t-random" data-key="b" disabled>Random blackouts <small>B</small></button>
      <button class="toggle" id="t-color" data-key="c" disabled>Colour <small>C</small></button>
      <button class="toggle" id="t-randcolor" data-key="d" disabled>Random colours <small>D</small></button>
      <button data-key="f" disabled>Fullscreen <small>F</small></button>
      <button data-key="l" disabled>Reload <small>L</small></button>
    </div>
  </section>

  <section class="client collapsed" id="timing-box">
    <h2 id="timing-head" tabindex="0" role="button">Timing <small>all players · seconds · not saved</small></h2>
    <div id="timing-rows"></div>
    <div class="row">
      <button id="timing-apply" class="primary" disabled>Apply to all</button>
      <button id="timing-reset" disabled>Back to saved</button>
    </div>
  </section>

  <div id="clients"><div class="empty">No player connected.</div></div>
</main>

<script src="/socket.io/socket.io.js"></script>
<script>
  // ?token=... in the address is sent to the hub when it requires one
  const token = new URLSearchParams(location.search).get("token") || "";
  const socket = io({ auth: { role: "controller", token } });

  const $ = (id) => document.getElementById(id);
  const buttons = [...document.querySelectorAll("button[data-key]")];
  let players = [];
  let connected = false;

  // command may carry { target: <player id> } to address a single player
  function send(command, button) {
    socket.emit("command", command, (reply) => {
      if (reply && !reply.ok) setStatus("warn", reply.error || "rejected");
    });
    if (button) { button.classList.add("sent"); setTimeout(() => button.classList.remove("sent"), 120); }
    if (navigator.vibrate) navigator.vibrate(10);
  }

  function setStatus(kind, text) {
    $("dot").className = "dot " + kind;
    $("status").textContent = text;
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  // A button that sends `command`, plus `target` when given.
  function commandButton(label, command, target, className) {
    const b = el("button", className);
    b.append(label);
    b.addEventListener("click", () => send(target ? { ...command, target } : command, b));
    return b;
  }

  // Buttons for the playlists that are scenes ("scene": true in playlists.json). Tapping the active one leaves it.
  function sceneChips(player, target) {
    const chips = el("div", "chips");
    chips.append(...(player.scenes || []).map((index) => {
      const chip = commandButton(player.playlists[index], { scene: index }, target);
      chip.classList.toggle("active", index === player.scene);
      return chip;
    }));
    return chips;
  }

  function playlistChips(player, target) {
    const chips = el("div", "chips");
    chips.append(...(player.playlists || []).map((name, index) => {
      const chip = commandButton(name, { playlist: index }, target);
      chip.classList.toggle("current", index === player.playlist);
      return chip;
    }));
    return chips;
  }

  // Players start folded. The ones opened are kept by name (the socket id changes on every
  // reconnect) and remembered in this browser.
  const expanded = new Set((() => {
    try { return JSON.parse(localStorage.getItem("expandedPlayers")) || []; } catch { return []; }
  })());
  const isCollapsed = (name) => !expanded.has(name);
  function toggleCollapsed(name, box, head) {
    if (expanded.has(name)) expanded.delete(name);
    else expanded.add(name);
    box.classList.toggle("collapsed", isCollapsed(name));
    head.setAttribute("aria-expanded", String(!isCollapsed(name)));
    try { localStorage.setItem("expandedPlayers", JSON.stringify([...expanded])); } catch {}
  }

  // Makes a heading fold / unfold its box (click, Enter or Space); the state is remembered under name.
  function toggleHead(box, head, name) {
    box.classList.toggle("collapsed", isCollapsed(name));
    head.setAttribute("aria-expanded", String(!isCollapsed(name)));
    head.addEventListener("click", () => toggleCollapsed(name, box, head));
    head.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      e.preventDefault();
      e.stopPropagation(); // not a player key
      toggleCollapsed(name, box, head);
    });
  }

  // The block for one connected player: its own media / playlist / output controls.
  function clientSection(p) {
    const name = p.name || "Player";
    const box = el("section", "client");
    const head = el("h2", "", name);
    head.tabIndex = 0;
    head.setAttribute("role", "button");
    head.setAttribute("aria-expanded", String(!isCollapsed(name)));
    head.addEventListener("click", () => toggleCollapsed(name, box, head));
    head.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      e.preventDefault();
      e.stopPropagation(); // not a player key
      toggleCollapsed(name, box, head);
    });
    box.classList.toggle("collapsed", isCollapsed(name));
    box.append(head);
    box.append(el("div", "file", (p.playlists ? `${p.playlists[p.playlist] ?? ""} · ` : "") + (p.file ? `${p.kind}: ${p.file}` : "nothing playing")));

    box.append(commandButton("Next media", { key: "arrowright" }, p.id));
    const shuffle = commandButton("Shuffle all", { key: "r" }, p.id, "toggle");
    shuffle.classList.toggle("active", !!p.shuffleAll);
    box.append(shuffle);

    const nav = el("div", "row");
    nav.append(commandButton("◀ Previous", { key: "x" }, p.id), commandButton("Next ▶", { key: "n" }, p.id));
    box.append(nav, playlistChips(p, p.id));
    if ((p.scenes || []).length) box.append(sceneChips(p, p.id));

    const out = el("div", "row three");
    for (const [label, key, on] of [["Blackout", "a", p.blackout], ["Circle", "m", p.mask], ["Syphon", "y", p.syphon], ["Keywords", "k", p.wordsOn], ["Random blackouts", "b", p.randomBlackouts], ["Colour", "c", p.colorFill], ["Random colours", "d", p.randomColors]]) {
      const b = commandButton(label, { key }, p.id, "toggle");
      b.classList.toggle("active", !!on);
      out.append(b);
    }
    box.append(out);
    return box;
  }

  function render() {
    const ready = connected && players.length > 0;
    buttons.forEach((b) => (b.disabled = !ready));
    $("spread").disabled = !ready;
    $("spread-random").disabled = !ready;
    $("timing-apply").disabled = !ready;
    $("timing-reset").disabled = !ready;
    setStatus(!connected ? "" : ready ? "on" : "warn",
      !connected ? "connecting…" : ready ? `${players.length} player${players.length > 1 ? "s" : ""}` : "no player");

    // "All players" shows the first player's state; its buttons act on every player
    const lead = players[0] || {};
    $("t-blackout").classList.toggle("active", !!lead.blackout);
    $("t-mask").classList.toggle("active", !!lead.mask);
    $("t-syphon").classList.toggle("active", !!lead.syphon);
    $("t-words").classList.toggle("active", !!lead.wordsOn);
    if (lead.timing && !timingDirty && !document.activeElement.matches("#timing-box input")) {
      for (const [key] of TIMING_ROWS) {
        const range = lead.timing[key];
        if (!range) continue;
        $(`tm-${key}-min`).value = range[0];
        $(`tm-${key}-max`).value = range[1];
      }
    }
    $("t-shuffle").classList.toggle("active", !!lead.shuffleAll);
    $("t-random").classList.toggle("active", !!lead.randomBlackouts);
    $("t-color").classList.toggle("active", !!lead.colorFill);
    $("t-randcolor").classList.toggle("active", !!lead.randomColors);

    const chips = $("chips");
    chips.replaceChildren(...(lead.playlists || []).map((name, index) => {
      const chip = document.createElement("button");
      chip.textContent = name;
      chip.disabled = !ready;
      chip.classList.toggle("current", index === lead.playlist);
      chip.addEventListener("click", () => send({ playlist: index }, chip));
      return chip;
    }));

    const hasScenes = (lead.scenes || []).length > 0;
    $("scenes-h").hidden = !hasScenes;
    $("scenes").hidden = !hasScenes;
    $("scenes").replaceChildren(...(lead.scenes || []).map((index) => {
      const chip = document.createElement("button");
      chip.textContent = lead.playlists[index];
      chip.disabled = !ready;
      chip.classList.toggle("active", index === lead.scene);
      chip.addEventListener("click", () => send({ scene: index }, chip));
      return chip;
    }));

    $("clients").replaceChildren(...(players.length ? players.map(clientSection) : [el("div", "empty", "No player connected.")]));
  }

  buttons.forEach((b) => b.addEventListener("click", () => send({ key: b.dataset.key }, b)));

  // Gives each player its own playlist: players in name order (numbers sorted naturally), playlist 1, 2, 3 …
  // (starts over when there are more players than playlists)
  $("spread").addEventListener("click", (e) => {
    const sorted = players; // already in name order
    const count = (sorted[0] && sorted[0].playlists || []).length;
    if (!count) return;
    sorted.forEach((p, i) => send({ playlist: i % count, target: p.id }));
    e.currentTarget.classList.add("sent");
    setTimeout(() => e.currentTarget.classList.remove("sent"), 120);
  });

  // Gives every player a different, random playlist. With more players than playlists, the
  // shuffle starts over, so playlists are repeated as little as possible.
  $("spread-random").addEventListener("click", (e) => {
    const allowed = (players[0] && players[0].randomPool) || [...Array((players[0] && players[0].playlists || []).length).keys()];
    if (!allowed.length) return;
    let pool = [];
    players.forEach((p) => {
      if (!pool.length) {
        pool = [...allowed];
        for (let i = pool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [pool[i], pool[j]] = [pool[j], pool[i]];
        }
      }
      send({ playlist: pool.pop(), target: p.id });
    });
    e.currentTarget.classList.add("sent");
    setTimeout(() => e.currentTarget.classList.remove("sent"), 120);
  });

  // Timing for every player at once. Changes are live only; the settings screen of a player saves them.
  const TIMING_ROWS = [["images", "Images"], ["videos", "Video segments"], ["texts", "Text pages"], ["wordHold", "Keywords shown"], ["wordGap", "Keywords pause"]];
  let timingDirty = false; // the fields were edited and not applied yet: do not overwrite them with the players' values
  $("timing-rows").replaceChildren(...TIMING_ROWS.map(([key, label]) => {
    const row = el("div", "trow");
    const range = el("div", "range");
    for (const bound of ["min", "max"]) {
      const input = el("input");
      input.type = "number"; input.min = "0"; input.step = "0.5"; input.id = `tm-${key}-${bound}`; input.inputMode = "decimal";
      input.addEventListener("input", () => (timingDirty = true));
      range.append(input);
      if (bound === "min") range.append(document.createTextNode("–"));
    }
    row.append(el("span", "", label), range);
    return row;
  }));
  toggleHead($("timing-box"), $("timing-head"), "timing");
  $("timing-apply").addEventListener("click", (e) => {
    const timing = {};
    for (const [key] of TIMING_ROWS) {
      const min = parseFloat($(`tm-${key}-min`).value), max = parseFloat($(`tm-${key}-max`).value);
      if (!(min >= 0) || !(max >= 0)) return setStatus("warn", "times must be numbers of 0 or more");
      timing[key] = [Math.min(min, max), Math.max(min, max)];
    }
    timingDirty = false;
    send({ timing }, e.currentTarget);
  });
  $("timing-reset").addEventListener("click", (e) => {
    timingDirty = false;
    send({ timing: "reset" }, e.currentTarget);
  });

  // the same keys work on a keyboard
  addEventListener("keydown", (e) => {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
    const key = e.key.toLowerCase();
    const button = buttons.find((b) => b.dataset.key === key);
    if (button && !button.disabled) { e.preventDefault(); send({ key }, button); }
  });

  socket.on("connect", () => { connected = true; render(); });
  socket.on("disconnect", () => { connected = false; players = []; render(); });
  socket.on("connect_error", (e) => { connected = false; setStatus("warn", e.message === "unauthorized" ? "wrong token" : "connecting…"); });
  // players are listed in name order (numbers sorted naturally: "… 2" before "… 10")
  const byName = (a, b) => String(a.name).localeCompare(String(b.name), undefined, { numeric: true });
  socket.on("players", (list) => { players = [...list].sort(byName); render(); });
  render();
</script>
</body>
</html>
